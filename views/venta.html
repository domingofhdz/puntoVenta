<div class="shadow shadow-lg p-2 rounded">
    <div class="row">
        <div class="col-12 col-sm-12 col-md-12 col-lg-6">
            <div class="mb-1">
                <h5>Venta #{{ detalles[0].id }}</h5>
                <p>Usuario: <b>{{ detalles[0].nombreUsuario }}</b>. Fecha Hora: <b>{{ detalles[0].fechaHora }}</b>.</p>
            </div>
            <form method="post" id="frmDetalleVenta">
                <div class="mb-1">
                    <label for="txtNombreProducto">Producto:</label>
                    <div class="row">
                        <div class="col-3 col-sm-4 col-md-4 col-lg-4 col-xl-4 col-xxl-4">
                            <input type="text" class="form-control" id="txtIdProducto" name="txtIdProducto" readonly>
                        </div>
                        <div class="col-9 col-sm-8 col-md-8 col-lg-8 col-xl-8 col-xxl-8">
                            <input type="text" class="form-control" id="txtNombreProducto" name="txtNombreProducto" placeholder="Busca el producto..">
                        </div>
                    </div>
                </div>
                <div class="mb-1">
                    <label for="txtPrecio">Precio:</label>
                    <input type="number" class="form-control" id="txtPrecio" name="txtPrecio">
                </div>
                <div class="mb-1">
                    <label for="txtCantidad">Cantidad:</label>
                    <input type="number" class="form-control" id="txtCantidad" name="txtCantidad">
                </div>
                <div class="mb-1 text-end">
                    <button class="btn btn-primary" id="btnAgregarDetalle" name="btnAgregarDetalle">Agregar</button>
                </div>
            </form>
        </div>
        <div class="col-12 col-sm-12 col-md-12 col-lg-6">
            <div class="table-responsive">
                <table class="table table-sm table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="detalle in detalles">
                            <td>{{ detalle.nombreProducto }}</td>
                            <td>$ {{ detalle.precio }}</td>
                            <td>&times; {{ detalle.cantidad }}</td>
                            <td>$ {{ detalle.precio * detalle.cantidad }}</td>
                        </tr>
                        <tr>
                            <th colspan="3">Total</th>
                            <th>$ {{ total }}</th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
